version: 2.1

# Run the fork's OWN GitHub Actions workflows via nektos/act on CircleCI compute
# (Actions stays disabled on this repo). Pull requests run the non-mutating validation
# workflows; merge-queue commits run the same checks plus merge-group-only validation.
#
# Auth: the `circleci-repo-readonly-authenticated-github-token` context provides a token
# scoped to read-only access for this repository. Because PR-controlled code receives it,
# the context must remain restricted to trusted contributors; untrusted PRs must not run
# these jobs.
#
# act receives an event payload for the current trigger so workflow expressions (especially
# base_ref) match GitHub Actions. act, its archive checksum, and the runner image are pinned.
#
# sccache and rust-cache stay disabled (remapped to no-ops + unset RUSTC_WRAPPER); they
# are compiler caches, not checks, and their GHA cache backend is ephemeral under act.
# Pages setup/artifact actions are also no-ops after book.yml completes its validation build.
#
# The pinned ethereum-optimism/act build synchronizes access to its shared GoGit action
# cache. Lint jobs run on separate 8-core xlarge machines, matching GitHub's distributed
# runner model instead of contending inside one machine. Unit jobs are likewise split
# across separate xlarge machines to match upstream's distributed runners. A preflight
# check fails if the static lint or unit shard lists drift from their workflows. Other
# workflows run up to four internal jobs.
#
# Excluded: pr-title.yml and label-pr.yml mutate PR metadata, while cyclops-audit.yml is a
# privileged label/comment integration. book.yml remains included for its validation build;
# its deployment job is skipped for pull_request and merge_group events.

jobs:
  act:
    parameters:
      wf:
        type: string
      event:
        type: enum
        enum: [pull_request, merge_group]
      resource:
        type: enum
        enum: [large, xlarge]
        default: xlarge
      job:
        type: string
        default: ""
      concurrent_jobs:
        type: integer
        default: 4
    machine:
      image: ubuntu-2404:2025.09.1
    resource_class: << parameters.resource >>
    steps:
      - checkout
      - run:
          name: Prepare GitHub event
          command: |
            set -euo pipefail
            : "${CIRCLE_SHA1:?missing CircleCI revision}"
            event_name="<< parameters.event >>"
            repository="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            case "$event_name" in
              pull_request)
                : "${CIRCLE_PULL_REQUEST:?pull-request trigger must provide CIRCLE_PULL_REQUEST}"
                pr_number="${CIRCLE_PULL_REQUEST##*/}"
                api_url="https://api.github.com/repos/${repository}/pulls/${pr_number}"
                curl --fail --silent --show-error --location \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${MISE_GITHUB_TOKEN:?missing restricted read-only GitHub token}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$api_url" > /tmp/pull-request.json
                jq --arg head_sha "$CIRCLE_SHA1" '
                  .head.sha = $head_sha |
                  {
                    action: "synchronize",
                    number: .number,
                    pull_request: .,
                    repository: .base.repo,
                    sender: .user
                  }
                ' /tmp/pull-request.json > /tmp/github-event.json
                head_ref="$(jq -r '.pull_request.head.ref' /tmp/github-event.json)"
                base_ref="$(jq -r '.pull_request.base.ref' /tmp/github-event.json)"
                echo "act event: pull_request #${pr_number}, ${head_ref} -> ${base_ref}"
                ;;
              merge_group)
                : "${CIRCLE_BRANCH:?merge-queue trigger must provide CIRCLE_BRANCH}"
                if [[ ! "$CIRCLE_BRANCH" =~ ^gh-readonly-queue/([^/]+)/ ]]; then
                  echo "merge_group requires a gh-readonly-queue branch, got: ${CIRCLE_BRANCH}" >&2
                  exit 1
                fi
                base_ref="${BASH_REMATCH[1]}"
                base_sha="$(git ls-remote origin "refs/heads/${base_ref}" | awk 'NR == 1 {print $1}')"
                : "${base_sha:?unable to resolve merge-queue base SHA}"
                jq -n \
                  --arg head_sha "$CIRCLE_SHA1" \
                  --arg head_ref "refs/heads/${CIRCLE_BRANCH}" \
                  --arg base_sha "$base_sha" \
                  --arg base_ref "refs/heads/${base_ref}" \
                  --arg repository "$repository" \
                  --arg repository_name "$CIRCLE_PROJECT_REPONAME" \
                  --arg repository_owner "$CIRCLE_PROJECT_USERNAME" \
                  '{
                    action: "checks_requested",
                    merge_group: {
                      head_sha: $head_sha,
                      head_ref: $head_ref,
                      base_sha: $base_sha,
                      base_ref: $base_ref
                    },
                    repository: {
                      full_name: $repository,
                      name: $repository_name,
                      owner: {login: $repository_owner}
                    }
                  }' > /tmp/github-event.json
                echo "act event: merge_group ${CIRCLE_BRANCH} -> ${base_ref}"
                ;;
            esac

            printf '%s' "$base_ref" > /tmp/act-base-ref
      - run:
          name: Install pinned act
          command: |
            set -euo pipefail
            readonly ACT_VERSION="0.2.89-action-cache-fix.1"
            readonly ACT_RELEASE="v0.2.89-action-cache-fix.4"
            readonly ACT_BINARY="act_Linux_x86_64"
            readonly ACT_SHA256="28bfcf1502f59a834b14f2fb23c39e5b253c2234d875592b5aa0a175f9674dce"
            curl --fail --silent --show-error --location \
              "https://github.com/ethereum-optimism/act/releases/download/${ACT_RELEASE}/${ACT_BINARY}" \
              --output "/tmp/${ACT_BINARY}"
            echo "${ACT_SHA256}  /tmp/${ACT_BINARY}" | sha256sum --check
            sudo install -m 0755 "/tmp/${ACT_BINARY}" /usr/local/bin/act
            test "$(act --version)" = "act version ${ACT_VERSION}"
      - run:
          name: Stub unsupported non-check actions
          command: |
            mkdir -p /tmp/noop-sccache /tmp/noop-rust-cache /tmp/noop-pages
            {
              echo 'name: noop-sccache'
              echo 'description: disabled sccache (act stub)'
              echo 'runs:'
              echo '  using: composite'
              echo '  steps:'
              echo '    - run: echo "sccache disabled (act stub)"'
              echo '      shell: bash'
            } > /tmp/noop-sccache/action.yml
            {
              echo 'name: noop-rust-cache'
              echo 'description: disabled ephemeral rust-cache (act stub)'
              echo 'inputs:'
              echo '  cache-on-failure:'
              echo '    required: false'
              echo '  cache-targets:'
              echo '    required: false'
              echo 'runs:'
              echo '  using: composite'
              echo '  steps:'
              echo '    - run: echo "rust-cache disabled (act stub)"'
              echo '      shell: bash'
            } > /tmp/noop-rust-cache/action.yml
            {
              echo 'name: noop-pages'
              echo 'description: disabled Pages setup/artifact plumbing (act stub)'
              echo 'runs:'
              echo '  using: composite'
              echo '  steps:'
              echo '    - run: echo "Pages plumbing disabled after validation build (act stub)"'
              echo '      shell: bash'
            } > /tmp/noop-pages/action.yml
      - run:
          name: Run << parameters.wf >> via act
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            event_name="<< parameters.event >>"
            base_ref="$(cat /tmp/act-base-ref)"
            target_job="<< parameters.job >>"
            act_job=()
            if [ -n "$target_job" ]; then
              case "$target_job" in
                crate-checks-[123])
                  act_job=(-j crate-checks --matrix "partition:${target_job##*-}")
                  ;;
                *)
                  act_job=(-j "$target_job")
                  ;;
              esac
            fi

            act_env=(--env "RUSTC_WRAPPER=" --env "GITHUB_BASE_REF=${base_ref}")
            if [ "$event_name" = "merge_group" ]; then
              act_env+=(
                --env "GITHUB_REF=refs/heads/${CIRCLE_BRANCH}"
                --env "GITHUB_SHA=${CIRCLE_SHA1}"
              )
            fi

            act "$event_name" -W ".github/workflows/<< parameters.wf >>" \
              "${act_job[@]}" \
              --eventpath /tmp/github-event.json \
              -P "ubuntu-latest=catthehacker/ubuntu@sha256:b839c14c4410998529ec18f951262bdf87a2b23bc1467304d07b491b9455e074" \
              --concurrent-jobs << parameters.concurrent_jobs >> \
              "${act_env[@]}" \
              -s GITHUB_TOKEN="${MISE_GITHUB_TOKEN:?missing restricted read-only GitHub token}" \
              --local-repository "mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696=/tmp/noop-sccache" \
              --local-repository "Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4=/tmp/noop-rust-cache" \
              --local-repository "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d=/tmp/noop-pages" \
              --local-repository "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9=/tmp/noop-pages"

  validate-act-shards:
    machine:
      image: ubuntu-2404:2025.09.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install pinned yq
          command: |
            set -euo pipefail
            readonly YQ_VERSION="v4.53.3"
            readonly YQ_BINARY="yq_linux_amd64"
            readonly YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
            curl --fail --silent --show-error --location \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" \
              --output "/tmp/${YQ_BINARY}"
            echo "${YQ_SHA256}  /tmp/${YQ_BINARY}" | sha256sum --check
            sudo install -m 0755 "/tmp/${YQ_BINARY}" /usr/local/bin/yq
            test "$(yq --version)" = "yq (https://github.com/mikefarah/yq/) version ${YQ_VERSION}"
      - run:
          name: Validate act shards
          command: .circleci/check-act-shards.sh

workflows:
  reth-act-pull-request:
    jobs:
      - validate-act-shards:
          filters:
            branches:
              ignore: /gh-readonly-queue\/.*/
      - act:
          event: pull_request
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "act-<< matrix.wf >>"
          matrix:
            parameters:
              wf:
                - book.yml
                - compact.yml
                - e2e.yml
                - grafana.yml
                - integration.yml
                - lint-actions.yml
          filters:
            branches:
              ignore: /gh-readonly-queue\/.*/
      - act:
          event: pull_request
          wf: lint.yml
          concurrent_jobs: 1
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "act-lint-<< matrix.job >>"
          requires:
            - validate-act-shards
          matrix:
            parameters:
              job: &lint_jobs
                - clippy-binaries
                - clippy
                - wasm
                - riscv
                - crate-checks-1
                - crate-checks-2
                - crate-checks-3
                - msrv
                - docs
                - fmt
                - udeps
                - book
                - typos
                - check-toml
                - grafana
                - no-test-deps
                - feature-propagation
                - deny
          filters:
            branches:
              ignore: /gh-readonly-queue\/.*/
      - act:
          event: pull_request
          wf: unit.yml
          resource: xlarge
          concurrent_jobs: 1
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "act-unit-<< matrix.job >>"
          requires:
            - validate-act-shards
          matrix:
            parameters:
              job: &unit_jobs
                - test
                - state
                - doc
          filters:
            branches:
              ignore: /gh-readonly-queue\/.*/

  reth-act-merge-queue:
    jobs:
      - validate-act-shards:
          name: merge-validate-act-shards
          filters:
            branches:
              only: /gh-readonly-queue\/.*/
      - act:
          event: merge_group
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "merge-act-<< matrix.wf >>"
          matrix:
            parameters:
              wf:
                - book.yml
                - compact.yml
                - e2e.yml
                - grafana.yml
                - integration.yml
                - lint-actions.yml
                - stage.yml
          filters:
            branches:
              only: /gh-readonly-queue\/.*/
      - act:
          event: merge_group
          wf: lint.yml
          concurrent_jobs: 1
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "merge-act-lint-<< matrix.job >>"
          requires:
            - merge-validate-act-shards
          matrix:
            parameters:
              job: *lint_jobs
          filters:
            branches:
              only: /gh-readonly-queue\/.*/
      - act:
          event: merge_group
          wf: unit.yml
          resource: xlarge
          concurrent_jobs: 1
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "merge-act-unit-<< matrix.job >>"
          requires:
            - merge-validate-act-shards
          matrix:
            parameters:
              job: *unit_jobs
          filters:
            branches:
              only: /gh-readonly-queue\/.*/
