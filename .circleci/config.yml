version: 2.1

# Run the fork's OWN GitHub Actions workflows against the PR commit via nektos/act,
# on CircleCI compute (Actions stays disabled on this repo). One CircleCI job per
# PR-triggered reth workflow, run in parallel; each executes the PR's real workflow file.

jobs:
  act:
    parameters:
      wf:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install act
          command: |
            curl -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh \
              | sudo bash -s -- -b /usr/local/bin
            act --version
      - run:
          name: Run << parameters.wf >> via act
          no_output_timeout: 45m
          command: |
            act pull_request -W ".github/workflows/<< parameters.wf >>" \
              -P ubuntu-latest=catthehacker/ubuntu:act-latest

workflows:
  reth-act-all:
    jobs:
      - act:
          name: "act-<< matrix.wf >>"
          matrix:
            parameters:
              wf:
                - lint-actions.yml
                - pr-title.yml
                - lint.yml
                - unit.yml
                - compact.yml
                - grafana.yml
                - book.yml
                - stage.yml
                - e2e.yml
                - integration.yml
