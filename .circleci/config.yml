version: 2.1

# Run the fork's OWN GitHub Actions workflows against the PR commit via nektos/act,
# on CircleCI compute (Actions stays disabled on this repo). One CircleCI job per
# PR-triggered reth workflow, in parallel; each runs the PR's real workflow file.
#
# Auth: the org's reusable read-only context `circleci-repo-readonly-authenticated-github-token`
# injects MISE_GITHUB_TOKEN (authenticated read-only). We pass it to act as GITHUB_TOKEN so
# act's runtime action fetches aren't anonymously rate-limited and checkout can fetch base
# refs. Read-only scope => safe to expose to act-executed PR code.
#
# sccache stays disabled (remap sccache-action -> no-op + unset RUSTC_WRAPPER); it's a
# compiler cache, not a check, and its GHA cache backend doesn't exist under act.
#
# Dropped from the matrix: pr-title.yml (title-lint that mutates the PR) and book.yml
# (GitHub Pages deploy) — not code CI.

jobs:
  act:
    parameters:
      wf:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install act
          command: |
            curl -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh \
              | sudo bash -s -- -b /usr/local/bin
            act --version
      - run:
          name: Stub sccache-action (disable; not a check)
          command: |
            mkdir -p /tmp/noop-sccache
            {
              echo 'name: noop-sccache'
              echo 'description: disabled sccache (act stub)'
              echo 'runs:'
              echo '  using: composite'
              echo '  steps:'
              echo '    - run: echo "sccache disabled (act stub)"'
              echo '      shell: bash'
            } > /tmp/noop-sccache/action.yml
      - run:
          name: Run << parameters.wf >> via act
          no_output_timeout: 45m
          command: |
            act pull_request -W ".github/workflows/<< parameters.wf >>" \
              -P ubuntu-latest=catthehacker/ubuntu:act-latest \
              --env RUSTC_WRAPPER= \
              -s GITHUB_TOKEN="${MISE_GITHUB_TOKEN:?context circleci-repo-readonly-authenticated-github-token must be attached}" \
              --local-repository "mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696=/tmp/noop-sccache"

workflows:
  reth-act-all:
    jobs:
      - act:
          context:
            - circleci-repo-readonly-authenticated-github-token
          name: "act-<< matrix.wf >>"
          matrix:
            parameters:
              wf:
                - lint-actions.yml
                - lint.yml
                - unit.yml
                - compact.yml
                - grafana.yml
                - stage.yml
                - e2e.yml
                - integration.yml
